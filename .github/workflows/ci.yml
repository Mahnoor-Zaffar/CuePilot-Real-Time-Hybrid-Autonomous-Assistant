name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push should not keep burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never launches Electron; skip the ~100 MB binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  server:
    name: server · py${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        working-directory: server
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}

      - name: Lint
        working-directory: server
        run: .venv/bin/ruff check .

      - name: Import check
        working-directory: server
        run: .venv/bin/python -c "from app.main import app; print(app.title)"

      - name: Test
        working-directory: server
        run: .venv/bin/python -m pytest -q

  migrations:
    name: server · migrations (postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cuepilot
          POSTGRES_PASSWORD: cuepilot
          POSTGRES_DB: cuepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuepilot -d cuepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CUEPILOT_TEST_DATABASE_URL: postgresql://cuepilot:cuepilot@127.0.0.1:5432/cuepilot
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        working-directory: server
        run: uv sync --frozen --extra dev --python 3.12

      # Proves the runner end to end: apply, idempotent re-run, dimension
      # rebuild through the down file, two replicas racing on boot, and the
      # turn journal surviving that rebuild. Then proves the journal itself:
      # queue semantics, write failure accounting, and a real Postgres round-trip.
      - name: Migration and journal integration tests
        working-directory: server
        run: .venv/bin/python -m pytest -q tests/test_migrations.py tests/test_journal.py

  local-embedder:
    name: server · local embedder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # This job exists so the semantic path is not a test double in CI. It
      # downloads ~30 MB of static embeddings once per run.
      - name: Sync dependencies (with the local extra)
        working-directory: server
        run: uv sync --frozen --extra dev --extra local --python 3.12

      - name: Real semantic retrieval
        working-directory: server
        run: .venv/bin/python -m pytest -q -m local

  desktop:
    name: desktop · typecheck + build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Build
        working-directory: desktop
        run: npm run build

      - name: Audio capability policy
        working-directory: desktop
        run: npm run check:audio

      - name: Upload renderer bundle
        uses: actions/upload-artifact@v7
        with:
          name: renderer-dist
          path: desktop/dist
          retention-days: 7
          if-no-files-found: error

  docs:
    name: docs · diagrams + links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Check mermaid diagrams and relative links
        run: npm run check:docs
