services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cuepilot-postgres
    environment:
      POSTGRES_USER: cuepilot
      POSTGRES_PASSWORD: cuepilot
      POSTGRES_DB: cuepilot
    ports:
      - "5433:5432"
    volumes:
      - cuepilot-pgdata:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuepilot -d cuepilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cuepilot-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    volumes:
      - cuepilot-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cuepilot-pgdata:
  cuepilot-redisdata:
